<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191714"><title>Watcha Cookin V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3eb;color:#191714;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.nav{height:64px;background:#fff;border-bottom:1px solid #e5ded3;display:flex;align-items:center;gap:22px;padding:0 20px;position:sticky;top:0;z-index:5}.logo{border:0;background:none;font-weight:900;font-size:20px}.logo span{color:#ff633f}.nav button{border:0;background:none;font-weight:700;color:#666}.spacer{flex:1}.page{max-width:1120px;margin:auto;padding:22px 16px 80px}.hero{background:#1b1917;color:#fff;border-radius:26px;padding:40px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(42px,7vw,68px);line-height:.95;margin:12px 0;letter-spacing:-3px}.hero em{color:#ff7758;font-style:normal}.hero p{color:#c9c4bd;max-width:600px}.heroart{font-size:110px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:#ff633f;color:#fff}.secondary{background:#fff;color:#191714}.panel,.card,.recipe{background:#fff;border:1px solid #e5ded3;border-radius:20px}.panel{padding:22px;margin:18px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.input{flex:1;min-width:180px;border:1px solid #d9d1c5;border-radius:11px;padding:12px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#ffede8;color:#b83f26;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}.chip button{border:0;background:none;color:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.recipe{overflow:hidden}.food{height:150px;background:linear-gradient(135deg,#eee6da,#fff);display:grid;place-items:center;font-size:65px;position:relative}.heart{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:36px;height:36px;background:#fff}.body{padding:14px}.body h3{margin:0}.muted{color:#777;font-size:13px}.match{font-size:25px;color:#187b55;font-weight:900}.bar{height:6px;background:#eee8df;border-radius:99px;margin:10px 0}.bar i{display:block;height:100%;background:#187b55;border-radius:99px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.tag{background:#f3eee6;border-radius:7px;padding:5px 7px;font-size:10px}.view{width:100%;border:0;background:#191714;color:#fff;border-radius:10px;padding:10px;font-weight:800}.section{margin-top:28px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.select{padding:9px;border:1px solid #d9d1c5;border-radius:9px;background:#fff}.search{display:flex;gap:8px}.search .input{max-width:720px}.detail img{width:100%;height:300px;object-fit:cover}.detailbody{padding:24px}.detailbody h1{font-size:42px;margin:6px 0}.detailbody li{margin:15px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.have{color:#187b55}.missing{color:#a7542c}.scanbox{border:2px dashed #cfc6b9;padding:30px;text-align:center;border-radius:18px;background:#faf8f4}.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.photos img{width:130px;height:130px;object-fit:cover;border-radius:12px}.empty{text-align:center;padding:55px;color:#777}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#191714;color:#fff;padding:11px 16px;border-radius:99px;display:none;z-index:20}.toast.show{display:block}.bottom{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.heroart{display:none}}@media(max-width:600px){.nav{gap:10px;padding:0 12px}.nav>button:not(.logo):not(.spacer){display:none}.page{padding:12px 10px 82px}.hero{padding:30px 22px}.grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid #e5ded3;z-index:10;justify-content:space-around}.bottom button{border:0;background:none;font-size:12px;font-weight:800}.bottom b{display:block;font-size:19px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const R=[
{id:'pbm',n:'Paneer Butter Masala',d:'Creamy tomato-paneer curry',c:'Indian',t:35,k:'Medium',e:['paneer','tomato','onion','cream','butter','garlic','garam masala'],w:[5,5,3,3,2,2,1],x:'🍛',g:['Vegetarian','Dinner'],s:['Sauté onion, garlic and butter.','Add tomato and cook until soft.','Blend into a sauce and add cream.','Add paneer and garam masala; simmer 8 minutes.']},
{id:'pt',n:'Paneer Tikka',d:'Spiced grilled paneer bites',c:'Indian',t:25,k:'Easy',e:['paneer','curd','capsicum','onion','chilli','garam masala'],w:[5,3,3,2,1,1],x:'🥘',g:['Vegetarian','Snack'],s:['Mix curd and spices.','Coat paneer and vegetables.','Grill or pan-sear until lightly charred.']},
{id:'pasta',n:'Creamy Tomato Pasta',d:'Comforting pasta in a quick tomato sauce',c:'Italian',t:20,k:'Easy',e:['pasta','tomato','garlic','cream','cheese'],w:[5,5,2,3,2],x:'🍝',g:['Vegetarian','Quick'],s:['Boil pasta until al dente.','Cook garlic and tomato.','Stir in cream and cheese.','Toss with pasta and serve.']},
{id:'fried',n:'Veg Fried Rice',d:'Fast rice with crunchy vegetables',c:'Asian',t:18,k:'Easy',e:['rice','carrot','peas','onion','soy sauce','garlic'],w:[5,3,3,2,2,2],x:'🍚',g:['Vegetarian','Quick'],s:['Heat a pan and sauté garlic.','Add vegetables and stir-fry.','Add cooked rice and soy sauce.','Toss on high heat and serve.']},
{id:'sand',n:'Paneer Sandwich',d:'Crispy toasted paneer sandwich',c:'Fusion',t:12,k:'Easy',e:['bread','paneer','onion','tomato','cheese'],w:[5,5,2,2,2],x:'🥪',g:['Vegetarian','Quick'],s:['Fill bread with paneer and vegetables.','Add cheese and toast until crisp.','Slice and serve.']},
{id:'chole',n:'Chole Masala',d:'Hearty chickpea masala',c:'Indian',t:40,k:'Medium',e:['chickpeas','tomato','onion','garlic','ginger','spices'],w:[5,5,3,2,2,2],x:'🫘',g:['Vegetarian','Dinner'],s:['Sauté onion, ginger and garlic.','Add tomato and spices.','Add cooked chickpeas and simmer.','Adjust seasoning and serve.']},
{id:'ome',n:'Masala Omelette',d:'Fluffy omelette with Indian spices',c:'Indian',t:10,k:'Easy',e:['egg','onion','tomato','chilli'],w:[6,2,2,1],x:'🍳',g:['Breakfast'],s:['Whisk eggs with chopped vegetables.','Season with salt and spices.','Cook in a lightly greased pan until set.']},
{id:'salad',n:'Paneer Power Salad',d:'Fresh salad with protein-rich paneer',c:'Fusion',t:15,k:'Easy',e:['paneer','lettuce','tomato','curd','lemon'],w:[5,3,2,2,1],x:'🥗',g:['Vegetarian','Light'],s:['Pan-sear paneer.','Chop vegetables.','Mix curd and lemon for dressing.','Combine and serve.']},
{id:'poha',n:'Poha',d:'Quick Indian breakfast',c:'Indian',t:15,k:'Easy',e:['poha','onion','peanuts','lemon','chilli'],w:[5,2,2,1,1],x:'🍋',g:['Vegetarian','Breakfast','Quick'],s:['Rinse poha gently.','Sauté onion and peanuts.','Add poha and seasonings.','Finish with lemon.']}
];
let S=JSON.parse(localStorage.wc2||'null')||{ings:[],saved:[],prefs:[],sort:'match',filter:'all'};let photos=[];
const $=s=>document.querySelector(s), norm=s=>s.toLowerCase().trim();function save(){localStorage.wc2=JSON.stringify(S)}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function match(r){let have=S.ings.map(x=>norm(x));let score=0,total=r.w.reduce((a,b)=>a+b,0);r.e.forEach((x,i)=>{if(have.some(h=>h===x||h.includes(x)||x.includes(h)))score+=r.w[i]});return Math.round(score/total*100)}
function shell(title,body){$('#app').innerHTML=`<header class="nav"><button class="logo" onclick="go('home')">Watcha <span>Cookin'</span></button><button onclick="go('discover')">Discover</button><button onclick="go('scan')">Scan</button><button onclick="go('saved')">Saved</button><button onclick="go('search')">Search</button><button class="spacer"></button><button onclick="go('profile')">Profile</button></header><main class="page">${body}</main><nav class="bottom"><button onclick="go('home')"><b>⌂</b>Home</button><button onclick="go('discover')"><b>◉</b>Discover</button><button onclick="go('scan')"><b>⌁</b>Scan</button><button onclick="go('saved')"><b>♡</b>Saved</button><button onclick="go('profile')"><b>●</b>Profile</button></nav>`}
function editor(){return `<div class="panel"><h2>What do you have?</h2><div class="row"><input class="input" id="ing" placeholder="e.g. paneer, tomato, rice" onkeydown="if(event.key==='Enter')add()"><button class="btn primary" onclick="add()">+ Add</button></div><div class="chips">${S.ings.map((x,i)=>`<span class="chip">${x}<button onclick="S.ings.splice(${i},1);save();go('home')">×</button></span>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="go('results')">Find my recipes →</button></div>`}
function cards(arr){if(!arr.length)return `<div class="empty">No recipes match that yet.</div>`;return `<div class="grid">${arr.map(r=>{let p=match(r),sv=S.saved.includes(r.id);return `<article class="recipe"><div class="food">${r.x}<button class="heart" onclick="event.stopPropagation();toggle('${r.id}')">${sv?'♥':'♡'}</button></div><div class="body"><div class="row" style="justify-content:space-between"><div><h3>${r.n}</h3><div class="muted">${r.c} • ${r.t} min • ${r.k}</div></div><b class="match">${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="muted">${p>=80?'Great match':p>=50?'You have most of it':'You’ll need a few ingredients'}</div><div class="tags">${r.g.map(x=>`<span class="tag">${x}</span>`).join('')}</div><button class="view" onclick="detail('${r.id}')">View recipe</button></div></article>`}).join('')}</div>`}
function home(){shell('Home',`<section class="hero"><div><div class="muted" style="color:#aaa">YOUR KITCHEN → YOUR MEAL</div><h1>So... what's <em>cookin'?</em></h1><p>Tell us what you have and Watcha Cookin' finds recipes that actually fit your kitchen.</p><div class="row"><button class="btn primary" onclick="$('#ing').focus()">+ Add ingredients</button><button class="btn secondary" onclick="go('scan')">📷 Scan</button></div></div><div class="heroart">🍳</div></section>${editor()}<section class="section"><div class="sectionhead"><h2>Popular recipes</h2><button class="btn secondary" onclick="go('discover')">See all</button></div>${cards(R.slice(0,6))}</section>`)}
function filtered(){let a=R.filter(r=>S.filter==='all'||r.k===S.filter);return a.sort((a,b)=>S.sort==='time'?a.t-b.t:S.sort==='name'?a.n.localeCompare(b.n):match(b)-match(a))}
function results(){shell('Matches',`<div class="sectionhead"><div><div class="muted">MATCHES</div><h1>Your best matches</h1><div class="muted">${S.ings.length} ingredients • ${filtered().length} recipes</div></div></div><div class="controls"><select class="select" onchange="S.sort=this.value;save();results()"><option value="match">Best match</option><option value="time">Fastest</option><option value="name">Name</option></select><select class="select" onchange="S.filter=this.value;save();results()"><option value="all">All difficulty</option><option>Easy</option><option>Medium</option></select></div>${S.ings.length?cards(filtered()):`<div class="empty"><h2>Add ingredients first</h2><button class="btn primary" onclick="go('home')">Add ingredients</button></div>`}`)}
function discover(){shell('Discover',`<section class="panel"><div class="muted">DISCOVER</div><h1>What are you craving?</h1><div class="search"><input class="input" id="dq" placeholder="paneer, quick, breakfast…" oninput="discoverFilter()"></div></section><div id="dres">${cards(R)}</div>`)}
function discoverFilter(){let q=norm($('#dq').value);let a=R.filter(r=>!q||norm(r.n+' '+r.d+' '+r.c+' '+r.g.join(' ')+' '+r.e.join(' ')).includes(q));$('#dres').innerHTML=cards(a)}
function scan(){shell('Scan',`<section class="panel"><div class="muted">SCAN</div><h1>Scan your kitchen</h1><p>Upload one or more ingredient photos. In this offline V2 build, detection is a local demo and every detected item is editable.</p><div class="scanbox"><label class="btn primary">📷 Choose photos<input id="file" type="file" accept="image/*" multiple capture="environment" hidden></label><div id="photos" class="photos"></div></div><div id="scanout"></div></section>`);$('#file').onchange=e=>{photos=[...e.target.files];$('#photos').innerHTML=photos.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('');if(photos.length)$('#scanout').innerHTML=`<div class="panel"><h2>Ready to scan ${photos.length} photo${photos.length>1?'s':''}</h2><button class="btn primary" onclick="fakeScan()">Start scan →</button></div>`}}
function fakeScan(){let found=['Paneer','Tomato','Onion','Garlic','Milk','Capsicum'];$('#scanout').innerHTML=`<div class="panel"><h2>Detected ingredients</h2><p>Edit anything that is wrong.</p>${found.map((x,i)=>`<div class="row" style="margin:7px 0"><input class="input" id="det${i}" value="${x}"></div>`).join('')}<button class="btn primary" onclick="confirmScan(${found.length})">Use these ingredients</button></div>`}
function confirmScan(n){for(let i=0;i<n;i++){let x=$('#det'+i).value.trim();if(x&&!S.ings.some(y=>norm(y)===norm(x)))S.ings.push(x)}save();toast('Ingredients added');go('results')}
function detail(id){let r=R.find(x=>x.id===id),p=match(r),have=r.e.filter(x=>S.ings.some(y=>norm(y)===x||norm(y).includes(x)||x.includes(norm(y)))),miss=r.e.filter(x=>!have.includes(x));shell('Recipe',`<div class="detail panel"><div class="food" style="height:220px;font-size:100px">${r.x}</div><div class="detailbody"><div class="muted">${r.c} • ${r.k} • ${r.t} min</div><h1>${r.n}</h1><p>${r.d}</p><div class="row"><b class="match">${p}% Match</b><button class="btn primary" onclick="toggle('${r.id}');detail('${r.id}')">${S.saved.includes(r.id)?'♥ Saved':'♡ Save recipe'}</button><button class="btn secondary" onclick="cook('${r.id}')">Start cooking</button></div><div class="split"><div><h2>You have</h2>${have.map(x=>`<p class="have">✓ ${x}</p>`).join('')||'<p class="muted">None yet</p>'}</div><div><h2>Missing</h2>${miss.map(x=>`<p class="missing">• ${x} <button class="btn secondary" onclick="toast('Added to shopping list')">+ list</button></p>`).join('')||'<p class="have">✓ Nothing missing</p>'}</div></div><h2>Steps</h2><ol>${r.s.map(x=>`<li>${x}</li>`).join('')}</ol></div></div>`)}
function cook(id){let r=R.find(x=>x.id===id),i=0;function draw(){$('#app').innerHTML=`<main style="min-height:100vh;background:#1b1917;color:#fff;padding:10vh 8vw;display:flex;flex-direction:column;justify-content:center"><div class="muted">COOKING MODE</div><p>Step ${i+1} of ${r.s.length}</p><div style="height:7px;background:#38332e;border-radius:99px"><i style="display:block;width:${(i+1)/r.s.length*100}%;height:100%;background:#ff633f;border-radius:99px"></i></div><h1 style="font-size:clamp(36px,7vw,72px)">${r.s[i]}</h1><div class="row"><button class="btn secondary" onclick="if(i>0){i--;draw()}">← Previous</button><button class="btn primary" onclick="if(i<r.s.length-1){i++;draw()}else{toast('Nice work!');detail('${r.id}')}">${i===r.s.length-1?'Finish':'Next →'}</button></div><button class="btn" style="background:none;color:#aaa;text-align:left" onclick="detail('${r.id}')">Exit cooking mode</button></main>`}draw()}
function saved(){let a=R.filter(r=>S.saved.includes(r.id));shell('Saved',`<div class="sectionhead"><div><div class="muted">YOUR COLLECTION</div><h1>Saved Recipes</h1></div></div>${cards(a)}`)}
function searchPage(){shell('Search',`<section class="panel"><div class="muted">SEARCH</div><h1>Find something delicious</h1><div class="search"><input class="input" id="sq" placeholder="Try paneer, quick, breakfast…" oninput="searchFilter()"></div></section><div id="sres">${cards(R)}</div>`)}
function searchFilter(){let q=norm($('#sq').value);let a=R.filter(r=>!q||norm(r.n+' '+r.d+' '+r.c+' '+r.g.join(' ')+' '+r.e.join(' ')).includes(q));$('#sres').innerHTML=cards(a)}
function profile(){shell('Profile',`<section class="panel"><div class="muted">PROFILE</div><h1>Your kitchen</h1><p>Everything is stored locally on this device.</p><h2>Preferences</h2><div class="row">${['Vegetarian','Vegan','Egg-free','Dairy-free'].map(x=>`<button class="btn ${S.prefs.includes(x)?'primary':'secondary'}" onclick="pref('${x}')">${S.prefs.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><p>${S.saved.length} saved recipes • ${S.ings.length} current ingredients</p><button class="btn secondary" onclick="localStorage.removeItem('wc2');location.reload()">Clear local data</button></section>`)}
function pref(x){S.prefs=S.prefs.includes(x)?S.prefs.filter(y=>y!==x):[...S.prefs,x];save();profile()}function add(){let v=$('#ing').value.trim();if(v){v.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!S.ings.some(y=>norm(y)===norm(x)))S.ings.push(x)});save();go('home')}}function toggle(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();toast(S.saved.includes(id)?'Saved recipe':'Removed from saved')}
function go(p){({home,results,discover,scan,saved,search:searchPage,profile}[p]||home)()}go('home');
</script></body></html>
